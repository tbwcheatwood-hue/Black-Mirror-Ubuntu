<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#171522"/>
      <stop offset="60%" stop-color="#0d0c13"/>
      <stop offset="100%" stop-color="#08070c"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="sliver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9e4ff"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- obsidian tile -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)" stroke="rgba(167,139,250,0.25)" stroke-width="2"/>

  <!-- ambient glow behind the mirror -->
  <ellipse cx="256" cy="256" rx="190" ry="190" fill="url(#glow)"/>

  <!-- mirror ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="18"/>

  <!-- inner face of the mirror -->
  <circle cx="256" cy="256" r="128" fill="#0a0910"/>

  <!-- reflective sliver: a vertical lens waiting on the other side -->
  <path d="M256 138
           C 300 170, 320 214, 320 256
           C 320 298, 300 342, 256 374
           C 212 342, 192 298, 192 256
           C 192 214, 212 170, 256 138 Z"
        fill="url(#sliver)" opacity="0.96"/>

  <!-- scan arcs across the sliver -->
  <path d="M212 220 Q 256 240 300 220" fill="none" stroke="#ded4ff" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round"/>
  <path d="M206 262 Q 256 284 306 262" fill="none" stroke="#ded4ff" stroke-opacity="0.32" stroke-width="5" stroke-linecap="round"/>
  <path d="M214 300 Q 256 320 298 300" fill="none" stroke="#ded4ff" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round"/>

  <!-- horizon tick on the ring -->
  <rect x="246" y="96" width="20" height="26" rx="6" fill="url(#ring)"/>
</svg>
